install:
  # 1. Download your secure files (p12 and p8)
  - appveyor DownloadFile [P12_FILE_ID] -FileName ios_distribution.p12
  - appveyor DownloadFile [P8_FILE_ID] -FileName AuthKey.p8
  
  # 2. Import the certificate into the Mac's keychain
  - security create-keychain -p "" build.keychain
  - security import ios_distribution.p12 -k build.keychain -P %P12_PASSWORD% -T /usr/bin/codesign
  
  # 3. Move your .mobileprovision file to where Xcode expects it
  - mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
  - cp your_file_name.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
  - echo "%ASC_PRIVATE_KEY%" > AuthKey.p8

build_script:
  # Build the archive
  - xcodebuild archive -project YourApp.xcodeproj -scheme YourApp -archivePath YourApp.xcarchive
  # Export the .ipa using your API Key
  - xcodebuild -exportArchive -archivePath YourApp.xcarchive -exportPath ./output -exportOptionsPlist exportOptions.plist -allowProvisioningUpdates -authenticationKeyID %ASC_KEY_ID% -authenticationKeyIssuerID %ASC_ISSUER_ID% -authenticationKeyPath ./AuthKey.p8

artifacts:
  - path: output/*.ipa
    name: AppStoreBuild